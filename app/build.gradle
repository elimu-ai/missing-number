plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.literacyapp.missing_number'
    compileSdk 36

    defaultConfig {
        applicationId "org.literacyapp.missing_number"
        minSdk 26
        targetSdk 34
        versionCode 1000000
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CONTENT_PROVIDER_APPLICATION_ID", "\"ai.elimu.content_provider\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    testImplementation libs.junit
    implementation libs.elimu.content.provider
    implementation libs.elimu.model
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.legacy.support.v4
}
